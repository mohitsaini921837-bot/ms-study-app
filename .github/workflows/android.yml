# MS Study — Build & Release APK (Phase 1)
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      Base64 of ~/workspace/ms-study/keystore/msstudy-release.keystore
#                        (alias "msstudy" — ALL future updates MUST use this keystore,
#                        or Android will refuse to install over the old version)
#   KEYSTORE_PASSWORD    Store password for the keystore
#   KEY_ALIAS            Key alias (msstudy)
#   KEY_PASSWORD         Key password
#
# NOTE: this workflow file itself can only be added to the repo via the
# browser web UI — the GitHub API returns 403 for workflow files.
# The parent agent handles adding it (do not try to push it via API/CLI).
#
# NOTE 2: update/version.json must be published at
# https://mohitsaini921837-bot.github.io/ms-study-app/version.json
# (GitHub Pages for the ms-study-app repo) or the in-app updater will
# never see a new version. Publish it from update/version.json when the
# repo's Pages setup is done.
#
# Repo layout assumed: repo root holds app/, update/ and this workflow
# (i.e. the contents of ~/workspace/ms-study/).
name: Build MS Study APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android project
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "android/ not committed — generating it"
            npx cap add android
            # Restore the custom native plugins + icons from the template
            cp android-template/java/com/kiara/msstudy/*.java android/app/src/main/java/com/kiara/msstudy/
            cp android-template/res/xml/provider_paths.xml android/app/src/main/res/xml/file_paths.xml
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp android-template/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
              cp android-template/res/mipmap-$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
            cp android-template/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi
          npx cap sync android

      - name: Restore release keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/msstudy-release.keystore
          ls -l android/msstudy-release.keystore

      - name: Build signed release APK
        run: |
          gradle -p android :app:assembleRelease --stacktrace \
            -Pmsstudy.keystore.file="$PWD/android/msstudy-release.keystore" \
            -Pmsstudy.keystore.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pmsstudy.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pmsstudy.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MS-Study-v1.0.20.apk
          ls -l MS-Study-v1.0.20.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms-study-v1.0.20-apk
          path: app/MS-Study-v1.0.20.apk
          if-no-files-found: error

      - name: Create GitHub Release v1.0.20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if gh release view v1.0.20 >/dev/null 2>&1; then
            gh release upload v1.0.20 app/MS-Study-v1.0.20.apk --clobber
          else
            gh release create v1.0.20 app/MS-Study-v1.0.20.apk \
              --title "MS Study v1.0.20" \
              --notes "Practice question sets (UPSI Reasoning, instant results)."
          fi
